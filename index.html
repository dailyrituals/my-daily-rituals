<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1e8"><title>My Daily Rituals</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#3b3a31;background:#f7f1e8}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:24px 18px 110px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#827c6f}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:39px;margin:8px 0}h2{font-size:25px}.muted{color:#817a70;font-size:14px}.card{background:#fffdf8;border:1px solid #e7dfd2;border-radius:19px;padding:19px;margin:15px 0;box-shadow:0 3px 16px #59462b08}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.chip{background:#eee5d7;border-radius:40px;padding:7px 11px;font-size:12px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffdf8;border-top:1px solid #e8dfd1;display:flex;justify-content:space-around;padding:12px 4px max(14px,env(safe-area-inset-bottom));z-index:3}.tabs button{border:0;background:none;color:#827b71;font-size:12px;padding:8px 4px}.tabs button.active{color:#775d46;font-weight:700}button,select,textarea,input{font:inherit}button.action{border:0;background:#78624f;color:white;border-radius:12px;padding:11px 14px}select,textarea,input[type=text]{width:100%;border:1px solid #d9cdbb;border-radius:11px;background:white;padding:11px;color:#443d35}textarea{min-height:88px;resize:vertical}.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee7de;font-size:14px}.task:last-child{border:0}.task input{width:19px;height:19px;accent-color:#86725d}.time{font-size:12px;color:#82766b;min-width:82px}.progress{height:7px;background:#eee7de;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#8c8e70;transition:width .2s}.field{margin:16px 0}.field label{display:block;font-size:13px;margin-bottom:7px}.empty{padding:24px;text-align:center;color:#817a70}.small{font-size:12px}button:focus-visible{outline:2px solid #5c6955} .note{background:#efe9db;padding:12px;border-radius:12px;font-size:13px;line-height:1.5}</style></head><body><main id="app"></main><nav class="tabs" id="tabs"></nav><script>
const sections=['Today','Routines','Fitness','Career','Journal','Reset'];const schedule=[['Monday','Regular', '5:30 AM'],['Tuesday','Regular','5:30 AM'],['Wednesday','Regular','5:30 AM'],['Thursday','Early','5:15 AM'],['Friday','Early','5:15 AM'],['Saturday','Early','5:15 AM'],['Sunday','Off','—']];const routines={Regular:[['4:00','Wake up + water'],['4:10','Yoga + gentle stretching'],['4:25','Meditation + journal'],['4:35','Get ready (30 minutes)'],['5:05','Breakfast + pack food'],['5:20','Final check + leave by 5:30']],Early:[['4:00','Wake up + hydrate'],['4:05','Stretch + breathing'],['4:15','Journal + intention'],['4:25','Get ready (30 minutes)'],['4:55','Breakfast + essentials'],['5:10','Leave by 5:15']],Coworker:[['3:30','Wake + hydrate'],['3:35','Stretch + intention'],['3:40','Get ready'],['4:10','Grab breakfast + leave by 4:10–4:20']],Off:[['Morning','Wake rested + hydrate'],['Morning','Yoga or walk'],['Morning','Journal + skincare'],['Morning','Enjoy a nourishing breakfast']]};const evenings=[['6:30 PM','Prep breakfast, clothes + bag'],['6:45 PM','Shower + skincare'],['7:00 PM','Stretch, read or journal'],['7:20 PM','Put phone away + dim lights'],['7:30–8:00','Bedtime window']];const fitness=[['Monday','Glutes + quads'],['Tuesday','Upper body + core'],['Wednesday','Recovery walk or yoga'],['Thursday','Glutes + hamstrings'],['Friday','Rest'],['Saturday','Optional Pilates, Muay Thai or full body'],['Sunday','Rest + mobility']];const career=[['Monday','Learn: 45 minutes of PM study'],['Wednesday','Apply: 60 minutes on Grayton workflows'],['Friday','Build: 45 minutes on checklists and systems']];const reset=['Laundry + fresh sheets','Tidy room and bathroom','Groceries + meal prep','Prepare outfits + work supplies','Review property management priorities','Schedule workouts','Set three weekly non-negotiables','Do something enjoyable'];let state;try{state=JSON.parse(localStorage.getItem('rituals-v1'))||{}}catch{state={}};state.tab ||= 'Today';state.routine ||= 'Regular';state.mode ||= 'Morning';state.checks ||= {};state.notes ||= {};function save(){localStorage.setItem('rituals-v1',JSON.stringify(state))}const el=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function task(label,key,time=''){return `<label class="task"><input type="checkbox" data-check="${esc(key)}" ${state.checks[key]?'checked':''}><span class="time">${esc(time)}</span><span>${esc(label)}</span></label>`}function list(items,prefix){return items.map(([t,v],i)=>task(v,prefix+i,t)).join('')}function meter(prefix,total){let count=Object.entries(state.checks).filter(([k,v])=>k.startsWith(prefix)&&v).length;return `<div class="row"><span class="muted">${count} of ${total} complete</span><span class="chip">${Math.round(count/total*100)||0}%</span></div><div class="progress"><div style="width:${count/total*100||0}%"></div></div>`}function card(s){return `<div class="card">${s}</div>`}function today(){let d=new Date().getDay(),day=schedule[(d+6)%7],routine=day[1];return `<div class="eyebrow">Your personal space</div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}.</h1><p class="muted">${day[0]} · ${routine==='Off'?'Day off':'Leave by '+day[2]}</p>${card(`<div class="row"><h2>Today's rituals</h2><span class="chip">${routine}</span></div>${meter('today-'+day[0]+'-',routines[routine].length)}${routines[routine].map(([t,v],i)=>task(v,'today-'+day[0]+'-'+i,t)).join('')}`)}${card(`<h2>Today's intention</h2><textarea data-note="today-${new Date().toDateString()}" placeholder="How do I want to show up today?">${esc(state.notes['today-'+new Date().toDateString()]||'')}</textarea>`)}${card(`<h2>A gentle reminder</h2><div class="note">Protect your sleep. When your energy is low, shorten the routine rather than forcing a perfect morning.</div>`)}`}
function routine(){let items=state.mode==='Evening'?evenings:routines[state.routine];let key='routine-'+state.mode+'-'+state.routine+'-';return `<h1>My routines</h1><p class="muted">Create a calm start and end to your day.</p>${card(`<div class="row"><button class="action" data-mode="Morning">Morning</button><button class="action" data-mode="Evening">Evening</button></div>${state.mode==='Morning'?`<div class="field"><label>Choose your morning</label><select id="routine-select">${Object.keys(routines).map(r=>`<option ${r===state.routine?'selected':''}>${r}</option>`).join('')}</select></div>`:''}<h2>${state.mode} rituals</h2>${meter(key,items.length)}${list(items,key)}`)}`}
function workouts(){return `<h1>Movement</h1><p class="muted">Four structured sessions, recovery built in.</p>${card(`<h2>Weekly workout split</h2>${meter('fitness-',fitness.length)}${fitness.map(([d,v],i)=>task(v,'fitness-'+i,d)).join('')}`)}${card(`<div class="note">Move sessions when needed. Consistency over perfection.</div>`)}`}
function work(){return `<h1>Career growth</h1><p class="muted">Learning property management, one useful system at a time.</p>${card(`<h2>This week's study blocks</h2>${meter('career-',career.length)}${career.map(([d,v],i)=>task(v,'career-'+i,d)).join('')}`)}${card(`<h2>What I learned</h2><textarea data-note="career" placeholder="New skills, questions, and next steps...">${esc(state.notes.career||'')}</textarea>`)}`}
function journal(){return `<h1>My journal</h1><p class="muted">A private place to reflect. Entries are stored on this device.</p>${card(`<h2>Morning reflection</h2>${['How do I want to feel today?','What is one way I can show up for myself?','My top three priorities'].map((q,i)=>`<div class="field"><label>${q}</label><textarea data-note="journal-am-${new Date().toDateString()}-${i}" placeholder="Write here...">${esc(state.notes['journal-am-'+new Date().toDateString()+'-'+i]||'')}</textarea></div>`).join('')}`)}${card(`<h2>Evening reflection</h2>${['What went well today?','What can I release before bed?'].map((q,i)=>`<div class="field"><label>${q}</label><textarea data-note="journal-pm-${new Date().toDateString()}-${i}" placeholder="Write here...">${esc(state.notes['journal-pm-'+new Date().toDateString()+'-'+i]||'')}</textarea></div>`).join('')}`)}`}
function weekly(){return `<h1>Weekly reset</h1><p class="muted">Clear your space, plan your week, and make room for joy.</p>${card(`<h2>Sunday checklist</h2>${meter('reset-',reset.length)}${reset.map((v,i)=>task(v,'reset-'+i)).join('')}<button class="action" id="clear-week" style="margin-top:15px">Start a new week</button>`)}${card(`<h2>Weekly intentions</h2><textarea data-note="weekly" placeholder="One internal, one physical, one career goal...">${esc(state.notes.weekly||'')}</textarea>`)}`}
function render(){el.innerHTML=({Today:today,Routines:routine,Fitness:workouts,Career:work,Journal:journal,Reset:weekly})[state.tab]();document.getElementById('tabs').innerHTML=sections.map(s=>`<button data-tab="${s}" class="${state.tab===s?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{state.checks[e.dataset.check]=e.checked;save();render()});document.querySelectorAll('[data-note]').forEach(e=>e.oninput=()=>{state.notes[e.dataset.note]=e.value;save()});document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;save();render();scrollTo(0,0)});document.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{state.mode=e.dataset.mode;save();render()});let sel=document.getElementById('routine-select');if(sel)sel.onchange=()=>{state.routine=sel.value;save();render()};let clear=document.getElementById('clear-week');if(clear)clear.onclick=()=>{if(confirm('Reset weekly workout, career, and reset checklists?')){Object.keys(state.checks).forEach(k=>{if(/^(fitness|career|reset)-/.test(k))delete state.checks[k]});save();render()}}}render();
</script></body></html>
