<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#702f3e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>My Daily Rituals · Vintage Romance</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="CE1254F4-FFEF-4943-AFEB-5C966C587ADB.PNG"><style>
:root{--bg:#f5eee6;--paper:#fffcf8;--wine:#702f3e;--rose:#c99a9c;--ink:#392b2e;--muted:#887a78;--line:#e8d9d3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.18}h1{font-size:36px;margin:9px 0}h2{font-size:25px;margin:0 0 14px}h3{font-size:20px;margin:0 0 9px}main{max-width:690px;margin:auto;padding:24px 16px 115px}.eyebrow{letter-spacing:2.3px;text-transform:uppercase;font-size:10px;font-weight:700;color:var(--wine)}.muted{color:var(--muted);font-size:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:19px;margin:14px 0;box-shadow:0 6px 24px #4d24220b}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.chip{background:#f1e2df;color:var(--wine);border-radius:30px;padding:5px 10px;font-size:12px}.btn{border:0;background:var(--wine);color:#fff;border-radius:11px;padding:10px 13px;font-size:13px;font-weight:600;cursor:pointer}.btn.alt{background:#f1e3df;color:var(--wine)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--wine)}.btn.tiny{padding:5px 9px;font-size:12px}.btn.danger{color:#a02e42;background:#f9e7e8}button,input,select,textarea{font:inherit}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #dfcec8;background:#fff;border-radius:10px;padding:10px;color:var(--ink);font-size:14px}textarea{min-height:85px;resize:vertical}.field{margin:11px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.task{display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0e6e1;padding:10px 0}.task:last-child{border:0}.task input{accent-color:var(--wine);height:19px;width:19px;flex-shrink:0}.task .time{min-width:68px;color:var(--muted);font-size:11px}.task .name{flex:1;font-size:13px}.task .done{text-decoration:line-through;opacity:.6}.meter{background:#f1e </style></head><body><main id="app"></main><nav id="nav" class="nav"></nav><script>
'use strict';
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const seed={schedule:[{type:'Regular',leave:'5:30 AM'},{type:'Regular',leave:'5:30 AM'},{type:'Regular',leave:'5:30 AM'},{type:'Early',leave:'5:15 AM'},{type:'Early',leave:'5:15 AM'},{type:'Early',leave:'5:15 AM'},{type:'Off',leave:''}],routines:{Regular:[['4:00','Wake up + hydrate'],['4:10','Yoga + stretching'],['4:25','Meditation + journal'],['4:35','Get ready (30 min)'],['5:05','Breakfast + pack food'],['5:20','Final check + leave']],Early:[['4:00','Wake up + water'],['4:05','Stretch + breathe'],['4:15','Journal + intention'],['4:25','Get ready (30 min)'],['4:55','Breakfast + essentials'],['5:10','Leave']],Coworker:[['3:30','Wake + hydrate'],['3:35','Gentle stretch'],['3:40','Get ready'],['4:10','Grab prepared breakfast + leave']],Off:[['Morning','Wake rested + hydrate'],['Morning','Walk or yoga'],['Morning','Journal + skincare'],['Morning','Breakfast + slow morning']],Evening:[['6:30 PM','Prepare breakfast, clothes + bag'],['6:45 PM','Shower + skincare'],['7:00 PM','Stretch, read or journal'],['7:20 PM','Put phone away'],['7:30–8 PM','Bedtime window']]},habits:['Hydrate before caffeine','Move my body','Set an intention','Eat or pack breakfast','Protect my sleep'],fitness:[['Monday','Glutes + quads'],['Tuesday','Upper body + core'],['Wednesday','Recovery walk or yoga'],['Thursday','Glutes + hamstrings'],['Friday','Rest'],['Saturday','Optional Pilates or Muay Thai'],['Sunday','Rest + mobility']],career:[['Monday','Learn: 45 min property management'],['Wednesday','Apply: Grayton workflows (60 min)'],['Friday','Build: checklists and systems (45 min)']],goals:[{title:'Build property management skills',category:'Career',progress:0},{title:'Train consistently',category:'Fitness',progress:0},{title:'Protect my rest and routines',category:'Wellness',progress:0}],events:[],workouts:[],wellness:{},journal:{},checks:{},notes:{},overrides:{},view:'Today',routine:'Regular',journalDate:'',theme:'Vintage Romance'};
const clone=x=>JSON.parse(JSON.stringify(x));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=(d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};const dow=d=>(new Date(d+'T12:00:00').getDay()+6)%7;const weekStart=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
let legacy={};try{legacy=JSON.parse(localStorage.getItem('rituals-v1')||'{}')||{}}catch{};let db;try{db=JSON.parse(localStorage.getItem('rituals-v2')||'null')}catch{};if(!db){db=clone(seed);db.notes=clone(legacy.notes||{});db.legacyChecks=clone(legacy.checks||{});if(seed.routines[legacy.routine])db.routine=legacy.routine;db.view='Today'};
function normalize(){for(const k of Object.keys(seed))if(db[k]===undefined)db[k]=clone(seed[k]);}normalize();function save(){try{localStorage.setItem('rituals-v2',JSON.stringify(db))}catch(e){alert('Storage full. Export a backup in Settings.')}};
const el=document.getElementById('app');let view=db.view||'Today';const box=s=>`<section class="card">${s}</section>`;const btn=(text,act,cls='alt')=>`<button class="btn ${cls}" data-action="${act}">${esc(text)}</button>`;const field=(label,val,key,type='text')=>`<div class="field"><label>${esc(label)}</label><input type="${type}" data-field="${key}" value="${esc(val)}"></div>`;const area=(label,key,val)=>`<div class="field"><label>${esc(label)}</label><textarea data-note="${esc(key)}" placeholder="Write here...">${esc(val||'')}</textarea></div>`;const meter=(items,prefix)=>{let n=items.filter((_,i)=>db.checks[prefix+i]).length;return `<div class="row"><span class="muted">${n} of ${items.length} completed</span><span class="chip">${items.length?Math.round(n/items.length*100):0}%</span></div><div class="meter"><div style="width:${items.length?n/items.length*100:0}%"></div></div>`};
function tasks(items,prefix,editable=false){return items.map((item,i)=>{let a=Array.isArray(item)?item:['',item];let key=prefix+i;return `<div class="task"><input type="checkbox" data-check="${esc(key)}" ${db.checks[key]?'checked':''}><span class="time">${esc(a[0])}</span><span class="name ${db.checks[key]?'done':''}">${esc(a[1])}</span>${editable?`<button class="btn tiny ghost" data-edit="${esc(prefix)}|${i}">Edit</button><button class="btn tiny danger" data-delete="${esc(prefix)}|${i}">×</button>`:''}</div>`}).join('')}
function editor(kind,arr,prefix,paired=false){return `${meter(arr,prefix)}${tasks(arr,prefix,true)}<div style="margin-top:12px">${btn('+ Add item','add:'+kind)}</div>`}
function today(){let date=iso(),day=DAYS[dow(date)],sch=db.overrides[date]||db.schedule[dow(date)],typ=sch.type,items=db.routines[typ]||[],prefix='day:'+date+':'+typ+':';let habitprefix='habit:'+date+':';return `<div class="eyebrow">The daily edit · ${esc(day)}</div><h1>Make today yours.</h1><p class="muted">${esc(new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}))}</p><div class="banner"><div class="eyebrow" style="color:#f6dce2">Today's rhythm</div><h2 style="margin:9px 0">${esc(typ==='Off'?'A slower kind of day':typ==='Coworker'?'Early pickup day':'Your workday ritual')}</h2><div class="muted">${esc(typ==='Off'?'No commute':`Leave by ${sch.leave||'your chosen time'}`)}</div><div style="margin-top:13px">${btn('Change today','override','ghost')}</div></div>${box(`<div class="row"><h2>Morning routine</h2><span class="chip">${esc(typ)}</span></div>${meter(items,prefix)}${tasks(items,prefix)}`)}${box(`<h2>Daily habits</h2>${meter(db.habits,habitprefix)}${tasks(db.habits,habitprefix)}${btn('Edit habits','go:Habits')}`)}${box(`<h2>Today's intention</h2>${area('How do I want to show up?','today-'+new Date().toDateString(),db.notes['today-'+new Date().toDateString()])}`)}${box(`<div class="row"><h2>Quick access</h2></div><div class="grid">${btn('Weekly calendar','go:Calendar')}${btn('Fitness journal','go:Fitness')}${btn('Career hub','go:Career')}${btn('My goals','go:Goals')}</div>`)}`}
function routines(){return `<div class="eyebrow">The art of showing up</div><h1>My rituals</h1><p class="muted">Change times, add steps, or remove anything that no longer fits.</p>${box(`<div class="field"><label>Choose routine</label><select data-select="routine">${Object.keys(db.routines).map(x=>`<option ${db.routine===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>${editor('routine',db.routines[db.routine]||[],'routine:'+db.routine+':',true)}${btn('+ New routine','newroutine','ghost')} ${btn('Rename routine','renameroutine','ghost')} ${btn('Delete routine','deleteroutine','danger')}`)}`}
function habits(){return `<div class="eyebrow">Little things, often</div><h1>Habit tracker</h1>${box(`<h2>My daily habits</h2>${editor('habits',db.habits,'habit:'+iso()+':')}`)}${box(`<h2>Weekly reflection</h2>${area('What habits feel good right now?','habits-reflection',db.notes['habits-reflection'])}`)}`}
function fitness(){return `<div class="eyebrow">Strength & softness</div><h1>Movement journal</h1>${box(`<h2>My workout split</h2>${editor('fitness',db.fitness,'fitness:'+weekStart()+':',true)}`)}${box(`<h2>Log a workout</h2>${field('Date',iso(),'workdate','date')}${field('Session name','','workname')}${field('Exercises / sets / weights','','workdetails')}${btn('Save workout','savework','')}`)}${box(`<h2>Workout history</h2>${db.workouts.length?db.workouts.slice().reverse().map((w,i)=>`<div class="item"><div class="row"><strong>${esc(w.name)}</strong>${btn('Delete','deletework:'+i,'danger')}</div><div class="muted">${esc(w.date)}</div><div class="small">${esc(w.details)}</div></div>`).join(''):'<p class="muted">No workouts logged yet.</p>'}`)}`}
function career(){return `<div class="eyebrow">Building your future</div><h1>Property management</h1>${box(`<h2>Study & work blocks</h2>${editor('career',db.career,'career:'+weekStart()+':',true)}`)}${box(`<h2>What I learned</h2>${area('Notes, questions and next steps','career',db.notes.career)}`)}`}
function journal(){let d=db.journalDate||iso(),j=db.journal[d]||{};return `<div class="eyebrow">A space of your own</div><h1>Personal journal</h1>${box(`<div class="field"><label>Entry date</label><input type="date" data-field="journalDate" value="${esc(d)}"></div>${area('Morning intention','j:'+d+':morning',j.morning)}${area('Today I am grateful for','j:'+d+':gratitude',j.gratitude)}${area('Evening reflection','j:'+d+':evening',j.evening)}${area('Free writing','j:'+d+':free',j.free)}<p class="muted">Entries save as you type, on this device.</p>`)}${box(`<h2>Earlier entries</h2>${Object.keys(db.journal).sort().reverse().slice(0,30).map(k=>`<div class="item row"><span>${esc(k)}</span>${btn('Open','journal:'+k,'ghost')}</div>`).join('')||'<p class="muted">Your entries will appear here.</p>'}`)}`}
function calendar(){let todayDate=iso();return `<div class="eyebrow">Make room for what matters</div><h1>Weekly calendar</h1>${box(`<h2>Work schedule</h2>${db.schedule.map((s,i)=>`<div class="item"><div class="row"><strong>${DAYS[i]}</strong><span class="chip">${esc(s.type)}</span></div><div class="row"><select data-day="${i}" style="max-width:55%">${['Regular','Early','Coworker','Off'].map(x=>`<option ${s.type===x?'selected':''}>${x}</option>`).join('')}</select><input style="max-width:40%" aria-label="Departure time" data-leave="${i}" value="${esc(s.leave)}" placeholder="Departure"></div></div>`).join('')}`)}${box(`<h2>Plans & appointments</h2>${field('Date',todayDate,'eventdate','date')}${field('Time','15:00','eventtime','time')}${field('What are you planning?','','eventname')}${btn('+ Add event','addevent','')}${db.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>`<div class="item row"><div><strong>${esc(e.name)}</strong><div class="muted">${esc(e.date)} · ${esc(e.time)}</div></div>${btn('Delete','delevent:'+e.id,'danger')}</div>`).join('')}`)}${box(`<h2>Weekly reset</h2>${editor('reset',db.reset||['Laundry + fresh sheets','Groceries + meal prep','Plan the week','Tidy room'],'reset:'+weekStart()+':')}`)}`}
function wellness(){let d=iso(),w=db.wellness[d]||{};return `<div class="eyebrow">Take care of you</div><h1>Wellness tracker</h1>${box(`<p class="muted">Today · ${esc(d)}</p>${field('Hours slept',w.sleep||'','well:sleep','number')}${field('Water (glasses)',w.water||'','well:water','number')}<div class="field"><label>Energy</label><select data-well="energy">${['','Low','Okay','Good','Great'].map(x=>`<option ${w.energy===x?'selected':''}>${x||'Choose energy level'}</option>`).join('')}</select></div>${area('How does my body feel?','wellnote:'+d,w.note)}`)}${box(`<h2>Recent days</h2>${Object.keys(db.wellness).sort().reverse().slice(0,7).map(k=>`<div class="item row"><span>${esc(k)}</span><span class="muted">${esc(db.wellness[k].sleep||'—')} h sleep · ${esc(db.wellness[k].water||'—')} glasses</span></div>`).join('')||'<p class="muted">Your wellness history will appear here.</p>'}`)}`}
function goals(){return `<div class="eyebrow">A life in progress</div><h1>Goals & vision</h1>${box(`<h2>My goals</h2>${db.goals.map((g,i)=>`<div class="item"><div class="row"><strong>${esc(g.title)}</strong><span class="chip">${esc(g.category)}</span></div><div class="field"><label>Progress · ${Number(g.progress)||0}%</label><input type="range" min="0" max="100" step="5" value="${Number(g.progress)||0}" data-progress="${i}"></div><div class="row">${btn('Edit','editgoal:'+i,'ghost')}${btn('Delete','deletegoal:'+i,'danger')}</div></div>`).join('')}${btn('+ Add goal','addgoal')}`)}${box(`<h2>My vision board</h2>${area('Describe your dream life, inspirations, and things you are working toward','vision',db.notes.vision)}`)}`}
function settings(){return `<div class="eyebrow">Make it yours</div><h1>App settings</h1>${box(`<h2>Customize anything</h2><p class="muted">Edit, add, and delete routines, habits, workout days, study tasks, events and goals from their sections. Your changes save automatically.</p>${btn('Edit routines','go:Routines')} ${btn('Edit calendar','go:Calendar')} ${btn('Edit goals','go:Goals')}`)}${box(`<h2>Back up your information</h2><p class="muted">Your data stays in this browser, not in GitHub. Export a backup before updating or switching devices.</p>${btn('Download backup (.json)','export','')}<div class="field"><label>Restore a previously downloaded backup</label><input type="file" id="restore" accept="application/json,.json"></div>`)}${box(`<h2>Version 1 migration</h2><p class="muted">Version 1 notes and checklist history are retained. Original V1 data is left untouched in your browser.</p>${btn('View original V1 data','legacy','ghost')}`)}${box(`<h2>Privacy</h2><p class="muted">This is a public website, but your personal entries are stored locally in your browser. Other people visiting the website cannot see them. Clearing browser data or switching devices can erase local entries unless you restore a backup.</p>`)} `}
function render(){normalize();const pages={Today:today,Routines:routines,Habits:habits,Fitness:fitness,Career:career,Journal:journal,Calendar:calendar,Wellness:wellness,Goals:goals,Settings:settings};if(!pages[view])view='Today';el.innerHTML=pages[view]();const nav=['Today','Routines','Habits','Fitness','Career','Journal','Calendar','Wellness','Goals','Settings'];document.getElementById('nav').innerHTML=nav.map(x=>`<button data-nav="${x}" class="${view===x?'active':''}">${({Today:'⌂',Routines:'☀',Habits:'✓',Fitness:'◉',Career:'▣',Journal:'✎',Calendar:'▦',Wellness:'♡',Goals:'☆',Settings:'⚙'})[x]}<br>${x}</button>`).join('');bind()}
function mutateList(kind){if(kind==='routine')return db.routines[db.routine];if(kind==='habits')return db.habits;if(kind==='fitness')return db.fitness;if(kind==='career')return db.career;if(kind==='reset')return db.reset||(db.reset=['Laundry + fresh sheets','Groceries + meal prep','Plan the week','Tidy room']);}
function addItem(kind,index){const arr=mutateList(kind),paired=['routine','fitness','career'].includes(kind);const current=index===undefined?(paired?['','']: ''):arr[index];let time='',name='';if(paired){time=prompt(kind==='routine'?'Time / label:':'Day / label:',current[0]);if(time===null)return;name=prompt('Task / description:',current[1]);}else name=prompt('Item name:',current);if(name===null||!name.trim())return;if(index===undefined)arr.push(paired?[time,name]:name);else arr[index]=paired?[time,name]:name;save();render()}
function act(action){if(action.startsWith('go:')){view=action.slice(3);db.view=view;save();render();scrollTo(0,0);return}if(action.startsWith('add:'))return addItem(action.slice(4));if(action==='newroutine'){let name=prompt('Name your new routine:');if(name&&!db.routines[name]){db.routines[name]=[];db.routine=name;save();render()}return}if(action==='renameroutine'){let name=prompt('New routine name:',db.routine);if(name&&name!==db.routine&&!db.routines[name]){db.routines[name]=db.routines[db.routine];delete db.routines[db.routine];db.routine=name;save();render()}return}if(action==='deleteroutine'){if(['Regular','Early','Coworker','Off','Evening'].includes(db.routine)){alert('Core routines cannot be deleted, but you can edit their steps.');return}if(confirm('Delete this routine?')){delete db.routines[db.routine];db.routine='Regular';save();render()}return}if(action==='override'){let date=iso(),old=db.overrides[date]||db.schedule[dow(date)],type=prompt('Today’s type: Regular, Early, Coworker, or Off',old.type);if(!['Regular','Early','Coworker','Off'].includes(type))return;let leave=type==='Off'?'':prompt('Departure time (example: 4:20 AM)',old.leave||'');if(leave===null)return;db.overrides[date]={type,leave};save();render();return}if(action==='savework'){let date=document.querySelector('[data-field="workdate"]').value,name=document.querySelector('[data-field="workname"]').value,details=document.querySelector('[data-field="workdetails"]').value;if(!name.trim())return alert('Enter a workout name first.');db.workouts.push({date,name,details});save();render();return}if(action.startsWith('deletework:')){let i=Number(action.split(':')[1]);if(confirm('Delete this workout log?')){db.workouts.splice(db.workouts.length-1-i,1);save();render()}return}if(action==='addevent'){let date=document.querySelector('[data-field="eventdate"]').value,time=document.querySelector('[data-field="eventtime"]').value,name=document.querySelector('[data-field="eventname"]').value;if(!name.trim())return alert('Enter an event name.');db.events.push({id:String(Date.now()),date,time,name});save();render();return}if(action.startsWith('delevent:')){if(confirm('Delete this event?')){db.events=db.events.filter(x=>x.id!==action.slice(9));save();render()}return}if(action==='addgoal'||action.startsWith('editgoal:')){let i=action==='addgoal'?-1:Number(action.split(':')[1]),old=i<0?{title:'',category:'Personal',progress:0}:db.goals[i];let title=prompt('Goal:',old.title);if(!title||!title.trim())return;let category=prompt('Category:',old.category);if(category===null)return;if(i<0)db.goals.push({title,category,progress:0});else Object.assign(db.goals[i],{title,category});save();render();return}if(action.startsWith('deletegoal:')){if(confirm('Delete this goal?')){db.goals.splice(Number(action.split(':')[1]),1);save();render()}return}if(action==='export'){let blob=new Blob([JSON.stringify({app:'my-daily-rituals',version:2,exported:iso(),data:db},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-daily-rituals-backup-'+iso()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return}if(action==='legacy'){alert('Version 1 notes: '+Object.keys(legacy.notes||{}).length+'; checklist items: '+Object.keys(legacy.checks||{}).length+'. Your original data remains saved separately.');return}}
function bind(){document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>{view=e.dataset.nav;db.view=view;save();render();scrollTo(0,0)});document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>act(e.dataset.action));document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{db.checks[e.dataset.check]=e.checked;save();render()});document.querySelectorAll('[data-note]').forEach(e=>e.oninput=()=>{let k=e.dataset.note;if(k.startsWith('j:')){let p=k.split(':'),d=p[1];db.journal[d]||={};db.journal[d][p[2]]=e.value}else if(k.startsWith('wellnote:')){let d=k.slice(9);db.wellness[d]||={};db.wellness[d].note=e.value}else db.notes[k]=e.value;save()});document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>{let [prefix,i]=e.dataset.edit.split('|');addItem(prefix.split(':')[0],Number(i))});document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{let [prefix,i]=e.dataset.delete.split('|'),kind=prefix.split(':')[0];if(confirm('Delete this item?')){mutateList(kind).splice(Number(i),1);save();render()}});document.querySelectorAll('[data-select="routine"]').forEach(e=>e.onchange=()=>{db.routine=e.value;save();render()});document.querySelectorAll('[data-day]').forEach(e=>e.onchange=()=>{db.schedule[Number(e.dataset.day)].type=e.value;save();render()});document.querySelectorAll('[data-leave]').forEach(e=>e.onchange=()=>{db.schedule[Number(e.dataset.leave)].leave=e.value;save()});document.querySelectorAll('[data-progress]').forEach(e=>e.onchange=()=>{db.goals[Number(e.dataset.progress)].progress=Number(e.value);save();render()});document.querySelectorAll('[data-well]').forEach(e=>e.onchange=()=>{let d=iso();db.wellness[d]||={};db.wellness[d][e.dataset.well]=e.value;save()});document.querySelectorAll('[data-field^="well:"]').forEach(e=>e.onchange=()=>{let d=iso();db.wellness[d]||={};db.wellness[d][e.dataset.field.slice(5)]=e.value;save()});let jd=document.querySelector('[data-field="journalDate"]');if(jd)jd.onchange=()=>{db.journalDate=jd.value;save();render()};let restore=document.getElementById('restore');if(restore)restore.onchange=async()=>{let f=restore.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.app!=='my-daily-rituals'||x.version!==2||!x.data||typeof x.data!=='object')throw Error('Not a Version 2 backup');if(confirm('Replace your current app data with this backup?')){db=x.data;normalize();save();render()}}catch(e){alert('Unable to restore: '+e.message)}}}
render();
</script></body></html>
